name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project metadata and distributable source structure
        run: python3 scripts/validate_repository.py
      # Full compilation requires Inventor's proprietary Interop DLL and happens
      # only on the maintainer-controlled Windows runner in release.yml.
